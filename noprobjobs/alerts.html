<!-- Hero (section 1) responsive layout is CSS-media-query driven, NOT this.state.wide: the SPA's

     rendering the single-column mobile layout on desktop). CSS guarantees the two-panel split at
     >=768px regardless of JS. Scoped to the hero classes; everything else stays JS-driven. -->
<style>
.ah-hero{padding:24px 16px 30px;gap:22px;grid-template-columns:1fr}
.ah-h1{font-size:31px}
.ah-sub{font-size:15.5px}
.ah-form{max-width:100%;justify-self:stretch}

.ah-hero{padding:48px 24px 54px;gap:48px;grid-template-columns:1.05fr 430px;align-items:start}
.ah-h1{font-size:44px}
.ah-sub{font-size:17.5px}
.ah-form{max-width:430px;justify-self:end}
}
</style>
